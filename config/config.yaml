project: PhageFlow
version: "3.0.0"
mode: purified_phage

samples_file: config/samples.tsv

threads: 24
memory_gb: 32

dirs:
  databases: databases
  results:   results
  reports:   reports

databases:
  checkv:   databases/checkv_db/checkv-db-v1.5
  pharokka: databases/pharokka_db
  genomad:  databases/genomad_db
  phold:    databases/phold_db
  phynteny: databases/phynteny_db
  kraken2:  databases/k2_db

envs:
  main:      phageflow
  genomad:   genomad
  phold:     phold
  lifecycle: bacphlip

assembly:
  kmers:      "21,33,55,77,99,127"
  min_length: 200

genomad:
  min_score: 0.7

checkv:
  min_completeness:   50      # umbral MQ para annotation_ready
  min_viral_genes:    1       # rescate LQ: mín. genes virales → drafts/
  length_rescue:      10000   # rescate ND moderado (10kb + ≥1 gen viral) → drafts/
  min_contig_bp:      1500    # filtro global: contigs < N bp descartados
  large_nd_rescue_bp: 30000   # ND ≥ N bp + ≥1 gen viral → annotation_ready (no drafts)
  min_bin_rescue_bp:  30000   # suma total del bin de drafts ≥ N bp → annotation_ready
  min_gene_density:   0.5

annotate:
  phold_gpu:           true   # --foldseek_gpu; set false for --cpu fallback
  phold_finetune:      true   # phage-finetuned ProstT5 model (recommended)
  phold_batch_size:    1      # ProstT5 batch size; increase on GPU (e.g. 4-8)
  phynteny_confidence: 0.7    # confidence threshold for Phynteny predictions
