project: PhageFlow
version: "3.0.0"
mode: purified_phage

samples_file: config/samples.tsv

threads: 22
memory_gb: 64

dirs:
  databases: databases
  hosts:     data/host_genomes
  results:   results
  reports:   reports

databases:
  checkv:   databases/checkv_db/checkv-db-v1.5
  pharokka: databases/pharokka_db
  genomad:  databases/genomad_db
  phold:    databases/phold_db
  kraken2:  databases/k2_db

envs:
  main:      phageflow
  genomad:   genomad
  phold:     phold
  lifecycle: bacphlip

assembly:
  kmers:      "21,33,55,77,99,127"
  min_length: 200

genomad:
  min_score: 0.7

checkv:
  min_completeness: 50
