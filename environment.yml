name: phageflow
channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  # ── Python ────────────────────────────────────────────────────────────────
  - python=3.11
  - pip
  - click >=8.1
  - rich >=13.0
  - pyyaml >=6.0
  - biopython >=1.80
  - pandas >=2.0
  - numpy >=1.24
  - matplotlib
  - tqdm

  # ── Module 01 — QC ────────────────────────────────────────────────────────
  - fastp
  - fastqc
  - multiqc

  # ── Module 02 — Host removal ──────────────────────────────────────────────
  - bwa-mem2
  - samtools >=1.15
  - seqtk
  - kraken2
  - ncbi-datasets-cli

  # ── Module 03 — Assembly ──────────────────────────────────────────────────
  - spades
  - megahit
  - cd-hit
  - seqkit

  # ── Module 04 — Viral ID ──────────────────────────────────────────────────
  - genomad

  # ── Module 05 — Quality ───────────────────────────────────────────────────
  - checkv
  - mash
  - minimap2

  # ── Module 06 — Annotation ────────────────────────────────────────────────
  - pharokka
  - phold
  - phynteny_transformer
  - dnaapler
  - pytorch

  # ── Utilities ─────────────────────────────────────────────────────────────
  - pigz
  - mummer4
  - diamond
  - hmmer
  - mafft
  - trimal
  - iqtree
