project: PhageFlow
version: "0.1.0"

# Threads: comment out to use auto-detection (90% of logical CPUs).
# threads: 24

memory_gb: 32

# Output directories. Relative paths are resolved from the project root.
# Override at runtime with -o / --reports-dir.
dirs:
  results: results
  reports: reports

databases:
  checkv:   databases/checkv_db/checkv-db-v1.5
  pharokka: databases/pharokka_db
  genomad:  databases/genomad_db
  phold:    databases/phold_db
  phynteny: databases/phynteny_db
  kraken2:  databases/k2_db

envs:
  main: phageflow

# ─────────────────────────────────────────────────────────────────────────────
# Module 02 — Host read removal
# ─────────────────────────────────────────────────────────────────────────────
# Module 01 - Quality Control (fastp)
# All values are read by phageflow/modules/qc.py
qc:
  average_qual: 20              # read-level mean Q floor; Q20=99% accuracy (Roux et al. 2019 MIUViG)
  qualified_quality_phred: 25   # per-base quality threshold (99% accuracy)
  unqualified_percent_limit: 15 # max % low-Q bases per read; lenient to retain divergent-phage reads
  length_required: 50           # minimum read length post-trim; 50 bp assembles reliably (Holtgrewe et al. 2013)
  cut_right_window_size: 4      # sliding-window size (bp)
  cut_right_mean_quality: 25    # sliding-window quality floor
  correction: true              # PE overlap correction
  overlap_len_require: 15       # min overlap (bp) for PE correction
  overlap_diff_percent_limit: 5 # max mismatch rate in overlap (%)
  low_complexity_filter: true   # homopolymer filter (Roux 2019 MIUViG)
  complexity_threshold: 20      # minimum complexity (%)
  trim_poly_x: true             # poly-X tail removal (NextSeq/NovaSeq)
  poly_x_min_len: 10            # min poly-X length to trigger trim (bp)
  n_base_limit: 5               # max N calls per read

host_removal:
  # NCBI accessions always merged with --host-file / --accessions.
  # Add lab propagation strains here so they are always removed.
  always_include_accessions: []
  # Example:
  #   always_include_accessions:
  #     - GCF_000005845.2   # E. coli K-12 MG1655

  contamination_warn_pct: 5.0
  kraken2_postfilter: false
  postfilter_min_pct: 1.0

# ─────────────────────────────────────────────────────────────────────────────
# Module 03 — Assembly (SPAdes + MEGAHIT + cd-hit-est)
# ─────────────────────────────────────────────────────────────────────────────
assembly:
  kmers: "21,33,55,77,99,127"    # SPAdes v4.x max k=127 (Bankevich et al. 2012)
  min_length: 200
  iterative_refinement: false   # run assembly-refine separately after quality

# ─────────────────────────────────────────────────────────────────────────────
# Module 04 — Viral identification (geNomad)
# ─────────────────────────────────────────────────────────────────────────────
genomad:
  min_score: 0.7
  min_virus_hallmarks: 0
  sensitivity: 4.2
  splits: 0
  rescue_min_score: 0.4
  rescue_min_length_bp: 10000
  enable_score_calibration: true
  composition: virome
  lenient_taxonomy: true
  disable_find_proviruses: true

# ─────────────────────────────────────────────────────────────────────────────
# Module 05 — Genome quality and selection (CheckV)
# ─────────────────────────────────────────────────────────────────────────────
checkv:
  min_completeness: 50
  min_viral_genes: 1
  length_rescue: 10000
  min_contig_bp: 1500
  large_nd_rescue_bp: 30000
  min_bin_rescue_bp: 30000
  min_gene_density: 0.5
  max_kmer_freq: 1.5
  max_genome_copies: 1.5

# ─────────────────────────────────────────────────────────────────────────────
# Module 06 — Annotation (Pharokka → Phold → Phynteny)
# ─────────────────────────────────────────────────────────────────────────────
annotate:
  phold_gpu: true
  phold_finetune: true
  phold_batch_size: 1
  phold_sensitivity: 9.5
  phynteny_confidence: 0.8
  genetic_code: 11
