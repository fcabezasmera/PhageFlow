project: PhageFlow
version: "0.1.0"

samples_file: config/samples.tsv

# Threads: comment out or remove to use auto-detection (90% of logical CPUs).
# threads: 24

memory_gb: 32

# Output directories. Relative paths are resolved from workdir.
# These can be overridden at runtime with -o / --reports-dir.
# dirs:
#   results: /absolute/path/to/results
#   reports: /absolute/path/to/reports

dirs:
  results: results
  reports: reports

databases:
  checkv:   databases/checkv_db/checkv-db-v1.5
  pharokka: databases/pharokka_db
  genomad:  databases/genomad_db
  phold:    databases/phold_db
  phynteny: databases/phynteny_db
  kraken2:  databases/k2_db

envs:
  main: phageflow

assembly:
  # k-mers for SPAdes and MEGAHIT (same value for reproducibility).
  # PE150: max effective k ≈ 127. Extending to 141 gives marginal gain.
  # Bankevich et al. 2012, J Comp Biol 19:455.
  kmers:      "21,33,55,77,99,127"
  min_length: 200

host_removal:
  # Accessions always merged with --host-file / --accessions.
  # Add your lab propagation strains here so they are always removed.
  # Genomes are downloaded once per sample to reports/02_host_removal/{sample}/host_genomes/
  # Empty by default — do NOT hardcode organisms unless you know they are
  # always present. Incorrect defaults remove phage reads silently.
  always_include_accessions: []
  # Example:
  #   always_include_accessions:
  #     - GCF_000005845.2   # E. coli K-12 MG1655

  # Level A: post-extraction contamination check (bwa-mem2 mode).
  # Subsamples 50,000 phage reads, classifies with Kraken2, warns if
  # bacterial fraction exceeds this threshold. Diagnostic only — no reads removed.
  # Only active when databases.kraken2 is configured.
  contamination_warn_pct: 5.0

  # Level B: adaptive bwa-mem2 post-filter (Kraken2 mode only, opt-in).
  # When true: parse the Kraken2 report, download reference genomes for
  # bacterial species > postfilter_min_pct%, and run a bwa-mem2 pass to
  # capture residual contamination + DTR/ITR singletons.
  # Adds 2-5 min (genome download + index) but recovers boundary reads.
  # Roux et al. 2019 eLife; Nayfach et al. 2021 Nat Biotechnol.
  kraken2_postfilter:  false
  postfilter_min_pct:  1.0

genomad:
  # 0.7 ≈ 97% precision. Camargo et al. 2023, Nat Biotechnol.
  min_score:            0.7
  min_virus_hallmarks:  0
  # Sensitivity: 4.2 (default). 5.7–7.5 to detect distant relatives.
  sensitivity:          4.2
  # Splits: 0 = geNomad auto memory management. Do NOT change unless OOM.
  # This is a memory parameter, NOT a parallelism parameter.
  splits:               0

  # Borderline rescue for novel lineages (score below min_score but
  # clearly phage based on size). Camargo et al. 2023.
  rescue_min_score:     0.4
  rescue_min_length_bp: 10000

  # Score calibration: adjusts scores for virome composition.
  # Reduces false negatives in novel lineages. Camargo et al. 2023.
  enable_score_calibration: true
  composition:              virome

  # Taxonomy at genus/species level (below family).
  # Required for biologically meaningful co-binning in Module 05.
  lenient_taxonomy: true

  # Provirus finding disabled: purified phage preparations should not
  # contain bacterial chromosomes. If proviruses appear, host removal failed.
  disable_find_proviruses: true

checkv:
  # Nayfach et al. 2021, Nat Biotechnol 39:578.
  min_completeness:   50      # MQ ≥50% → annotation_ready/
  min_viral_genes:    1       # LQ rescue: ≥1 viral gene → drafts/
  length_rescue:      10000   # ND ≥10kb + ≥1 gene → drafts/
  min_contig_bp:      1500    # contigs shorter than this are discarded
  large_nd_rescue_bp: 30000   # ND ≥30kb + ≥1 gene → annotation_ready/ (myovirus rule)
  min_bin_rescue_bp:  30000   # draft bin (same taxon) ≥30kb → annotation_ready/
  min_gene_density:   0.5     # genes/kb minimum for density-based rescue

  # Concatemer / genome copy detection.
  # Contigs exceeding these thresholds are flagged and excluded.
  # CheckV PyPI documentation.
  max_kmer_freq:    1.5
  max_genome_copies: 1.5

annotate:
  # Phold
  phold_gpu:         true   # --foldseek_gpu; false → --cpu
  phold_finetune:    true   # phage-finetuned ProstT5 model (recommended)
  phold_batch_size:  1      # ESM batch size; increase on GPU (4–8)
  phold_sensitivity: 9.5   # Foldseek sensitivity; 7.5 is ~2x faster
  # Phynteny
  phynteny_confidence: 0.8  # tool source default (calibrated confidence)
  # Genetic code default: 11 (standard phage/bacterial).
  # Overridden per candidate from geNomad _virus_genes.tsv when different.
  # Code 15 = crAss-like (TAG→Gln). Pharokka -g flag.
  genetic_code: 11
