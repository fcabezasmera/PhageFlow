project: PhageFlow
version: "0.1.0"

# Execution mode: purified_phage | virome_reads | virome_contigs
mode: purified_phage

samples_file: config/samples.tsv

threads: 8
memory_gb: 32

databases:
  checkv:   databases/checkv_db/checkv-db-v1.5
  pharokka: databases/pharokka_db
  genomad:  databases/genomad_db
  phold:    databases/phold_db
  # kraken2: /path/to/kraken2_db   # required for auto host detection

envs:
  main:      phageflow
  genomad:   genomad
  phold:     pholdENV
  lifecycle: bacphlip_env

assembly:
  kmers:      "21,33,55,77,99,127"
  min_length: 500

genomad:
  min_score:     0.7
  min_hallmarks: 0

checkv:
  min_completeness: 50
